services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/music:/app/backend/music
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Raspberry Pi IoT Client
  # CẢNH BÁO: Service này CHỈ chạy trên Raspberry Pi!
  # Trên Mac/Windows, dùng mock mode hoặc comment service này
  raspberry-pi:
    build:
      context: ./raspberry-pi
      dockerfile: Dockerfile
    container_name: iot-raspberry-pi-client
    restart: unless-stopped

    # Hardware access for Raspberry Pi
    privileged: true
    network_mode: host
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip4:/dev/gpiochip4
      - /dev/video0:/dev/video0
      - /dev/snd:/dev/snd

    volumes:
      - ./raspberry-pi/config/.env:/app/config/.env:rw
      - raspberry-pi-logs:/var/log

    environment:
      - PYTHONUNBUFFERED=1
      # Mock mode - set to "false" khi chạy trên Pi thật với hardware
      - MOCK_MODE=${MOCK_MODE:-false}
      # Backend URL - connect to localhost (network_mode: host)
      - WEBSOCKET_SERVER_URL=ws://localhost:8000/ws/gemini

    depends_on:
      - backend

    # Profiles để control service
    # Chạy: docker-compose --profile raspberry-pi up
    profiles:
      - raspberry-pi

volumes:
  raspberry-pi-logs:
    driver: local
